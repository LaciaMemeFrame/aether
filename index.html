<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>AETHER</title>
    <meta name="description" content="Cinematic WebGL music visualizer. Drop a track, watch it bloom." />
    <meta name="theme-color" content="#05050a" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&family=Syne:wght@600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --void: #05050a;
        --fg: #e8eaee;
        --muted: #8b909a;
        --cyan: #7ee7ff;
        --line: rgb(232 234 238 / 12%);
        --glass: rgb(8 8 14 / 55%);
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; background: var(--void); color: var(--fg); overflow: hidden; font-family: Outfit, system-ui, sans-serif; }
      canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
      .vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 42%, rgb(0 0 0 / 58%) 100%); }
      #gate {
        position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 20px; background: transparent;
        border: 0; color: inherit; cursor: pointer;
      }
      h1 {
        margin: 0; font-family: Syne, sans-serif; font-weight: 600; letter-spacing: 0.42em;
        font-size: clamp(2rem, 6vw, 3.75rem);
      }
      #gate p { margin: 0; font-weight: 300; letter-spacing: 0.28em; text-transform: uppercase; font-size: 0.875rem; color: var(--muted); }
      #hud {
        position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; display: flex; flex-direction: column;
        align-items: center; gap: 12px; padding: 32px 16px max(20px, env(safe-area-inset-bottom));
        background: linear-gradient(to top, rgb(5 5 10 / 80%), transparent);
        opacity: 1; transition: opacity 500ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      #hud[data-show="0"] { opacity: 0; }
      #label { margin: 0; font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); }
      .bar {
        display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 28px;
        border: 1px solid var(--line); background: var(--glass); backdrop-filter: blur(12px);
      }
      .bar button {
        height: 44px; min-width: 44px; border: 0; background: transparent; color: var(--fg);
        cursor: pointer; border-radius: 20px; letter-spacing: 0.18em; text-transform: uppercase;
        font: 400 12px Outfit, sans-serif;
      }
      .bar button[data-on="1"] { color: var(--cyan); }
      .hint { margin: 0; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: rgb(139 144 154 / 80%); }
      input[type="range"] { width: 96px; accent-color: var(--cyan); }
      #err { position: absolute; top: 24px; left: 50%; transform: translateX(-50%); color: #ff6b4a; font-size: 12px; }
      #file { display: none; }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div class="vignette"></div>
    <button id="gate" type="button">
      <h1>AETHER</h1>
      <p>нажмите, чтобы войти</p>
    </button>
    <div id="hud" hidden>
      <p id="label"></p>
      <div class="bar">
        <button id="music" type="button" aria-label="Загрузить трек">трек</button>
        <button id="mic" type="button" aria-label="Микрофон">mic</button>
        <button id="demo" type="button">демо</button>
        <button id="mute" type="button" aria-label="Громкость">звук</button>
        <input id="vol" type="range" min="0" max="1" step="0.01" value="0.82" aria-label="Громкость" />
      </div>
      <p class="hint">перетащите трек сюда</p>
    </div>
    <input id="file" type="file" accept="audio/*" />
    <p id="err"></p>
    <script type="module" src="./aether.js"></script>
  </body>
</html>
