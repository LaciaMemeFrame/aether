<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>AETHER</title>
    <meta name="description" content="Cinematic WebGL music visualizer." />
    <meta name="theme-color" content="#020206" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <style>
      html, body { height: 100%; margin: 0; background: #020206; overflow: hidden; }
      canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
      .vignette {
        position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse at center, transparent 38%, rgb(0 0 0 / 72%) 100%);
      }
      .sr-only {
        position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
        overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
      }
    </style>
  </head>
  <body>
    <h1 class="sr-only">AETHER</h1>
    <canvas id="stage"></canvas>
    <div class="vignette"></div>
    <script type="module" src="./aether.js"></script>
  </body>
</html>
